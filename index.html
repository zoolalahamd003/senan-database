<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoe Stockroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="interface.css" />
  </head>
  <body>
    <header id="topbar">
      <div id="topbar-title">
        <span id="topbar-mark">Stockroom</span>
        <h1>SENAN SHOES</h1>
      </div>
      <div id="topbar-stats">
        <div class="stat">
          <span class="stat-value" id="statpairs">0</span>
          <span class="stat-label">pairs in stock</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statmodels">0</span>
          <span class="stat-label">listed models</span>
        </div>
      </div>
    </header>

    <main id="layout">
      <!-- ==================== ADD SHOE ==================== -->
      <section id="shoeform">
        <h2>Add a shoe</h2>

        <form id="form">
          <div class="field">
            <label for="companyinput">Brand</label>
            <select id="companyinput">
              <option value="NIKE">Nike</option>
              <option value="ADIDAS">Adidas</option>
              <option value="PUMA">Puma</option>
              <option value="REEBOK">Reebok</option>
              <option value="NEW_BALANCE">New Balance</option>
              <option value="CONVERSE">Converse</option>
              <option value="VANS">Vans</option>
              <option value="ASICS">Asics</option>
              <option value="SKECHERS">Skechers</option>
              <option value="UNDER_ARMOUR">Under Armour</option>
              <option value="JORDAN">Jordan</option>
              <option value="TIMBERLAND">Timberland</option>
              <option value="FILA">Fila</option>
              <option value="BATA">Bata</option>
              <option value="CLARKS">Clarks</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="shoenameinput">Shoe name</label>
            <input id="shoenameinput" type="text" placeholder="Air Max 90" />
          </div>

          <div class="field">
            <label for="imageinput">Photos</label>
            <input type="file" id="imageinput" multiple accept="image/*" />
          </div>

          <div class="field">
            <label for="priceinput">Price</label>
            <input id="priceinput" type="number" placeholder="0" />
          </div>

          <div class="field">
            <label for="genderinput">Gender</label>
            <select id="genderinput">
              <option value="MALE">Men</option>
              <option value="FEMALE">Women</option>
              <option value="UNISEX">Unisex</option>
            </select>
          </div>

          <div class="field">
            <label for="conditioninput">Condition</label>
            <select id="conditioninput">
              <option value="NEW">New</option>
              <option value="USED">Used</option>
            </select>
          </div>

          <div class="field field-wide">
            <label>Colors available</label>
            <div id="colorpicker" class="swatchpicker"></div>
          </div>

          <div class="field field-wide">
            <label>Sizes &amp; stock</label>
            <div id="sizerows"></div>
            <button type="button" id="addsizerowbtn" class="ghostbtn">
              + Add size
            </button>
          </div>

          <button id="addinputbtn" type="submit">Add shoe</button>
        </form>
      </section>

      <!-- ==================== INVENTORY ==================== -->
      <section id="tablediv">
        <div id="tablediv-head">
          <h3>Inventory</h3>
          <div id="tablecontrols">
            <button id="searchbtn">Search by brand</button>
            <button id="resetbtn">Reset</button>
          </div>
        </div>

        <p id="editinghint">Click any cell to edit it in place.</p>

        <div id="tablescroll">
          <table id="table">
            <thead>
              <tr>
                <th>Brand</th>
                <th>Shoe name</th>
                <th>Photo</th>
                <th>Colors</th>
                <th>Sizes &amp; stock</th>
                <th>Price</th>
                <th>Gender</th>
                <th>Condition</th>
                <th>Remove</th>
              </tr>
            </thead>
            <tbody id="tablerow"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- ==================== DUPLICATE MODAL ==================== -->
    <div id="modaloverlay">
      <div id="modal">
        <button id="closemodalbtn">✕</button>
        <h4>Already in stock</h4>
        <h6>This shoe already exists in your inventory</h6>
        <p id="brandmodal">Brand:</p>
        <p id="shoemodal">Shoe:</p>
      </div>
    </div>

    <!-- ==================== VALIDATION MODAL ==================== -->
    <div id="emptyinputmodal">
      <p id="emptyinputmessage"></p>
      <button id="closeemptyinputmodal">OK</button>
    </div>

    <!-- ==================== LOADING ==================== -->
    <div id="loadingOverlay">
      <div id="loadingBox">
        <div id="loadingSpinner"></div>
        <p>Loading…</p>
      </div>
    </div>

    <!-- ==================== SEARCH MODAL ==================== -->
    <div id="searchmodal">
      <div id="searchbox">
        <button id="closesearchmodal">✕</button>
        <h2>Search by brand</h2>

        <select id="searchbrandinput">
          <option value="NIKE">Nike</option>
          <option value="ADIDAS">Adidas</option>
          <option value="PUMA">Puma</option>
          <option value="REEBOK">Reebok</option>
          <option value="NEW_BALANCE">New Balance</option>
          <option value="CONVERSE">Converse</option>
          <option value="VANS">Vans</option>
          <option value="ASICS">Asics</option>
          <option value="SKECHERS">Skechers</option>
          <option value="UNDER_ARMOUR">Under Armour</option>
          <option value="JORDAN">Jordan</option>
          <option value="TIMBERLAND">Timberland</option>
          <option value="FILA">Fila</option>
          <option value="BATA">Bata</option>
          <option value="CLARKS">Clarks</option>
          <option value="OTHER">Other</option>
        </select>

        <button id="performsearchbtn">Search</button>
      </div>
    </div>

    <script src="interface.js"></script>
  </body>
</html>
