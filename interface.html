<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DATABASE ADMIN</title>
    <link rel="stylesheet" href="interface.css" />
  </head>
  <body>
    <nav>
      <h1>SHOE DATABASE ADMIN</h1>
    </nav>

    <div id="shoeform">
      <h2>ADD NEW SHOE</h2>

      <form id="form">


        <label for="companyinput">BRAND/COMPANY</label>
        <select id="companyinput">
  <option value="NIKE">NIKE</option>
  <option value="ADIDAS">ADIDAS</option>
  <option value="PUMA">PUMA</option>
  <option value="REEBOK">REEBOK</option>
  <option value="NEW_BALANCE">NEW BALANCE</option>
  <option value="CONVERSE">CONVERSE</option>
  <option value="VANS">VANS</option>
  <option value="ASICS">ASICS</option>
  <option value="SKECHERS">SKECHERS</option>
  <option value="UNDER_ARMOUR">UNDER ARMOUR</option>
  <option value="JORDAN">JORDAN</option>
  <option value="TIMBERLAND">TIMBERLAND</option>
  <option value="FILA">FILA</option>
  <option value="BATA">BATA</option>
  <option value="CLARKS">CLARKS</option>
  <option value="OTHER">OTHER</option>
</select>

        <label for="shoenameinput">SHOE NAME</label>
        <input id="shoenameinput" type="text" />

        <label for="sizeinput">SHOE SIZE</label>
        <input type="number" id="sizeinput">

        <label for="imageinput">IMAGE </label>
        <input type="file" id="imageinput" multiple accept="image/*">

        <label for="priceinput">PRICE</label>
        <input id="priceinput" type="number" />

        <label for="genderinput">GENDER</label>
       <select id="genderinput">
      <option value="MALE">MALE</option>
        <option value="FEMALE">FEMALE</option>
       <option value="UNISEX">UNISEX</option>
      </select>

        <label for="conditioninput">CONDITION</label>
        <select id="conditioninput">
          <option value="USED">USED</option>
          <option value="NEW">NEW</option>
        </select>

        <label for="stockinput">STOCK</label>
        <input id="stockinput" type="number" />

        <button id="addinputbtn" type="submit">ADD SHOE</button>

        

      </form>
 <button id="searchbtn">SEARCH</button>
 <button id="resetbtn">RESET SEARCH</button>
    </div>

    <div id="tablediv">
      <h3>SHOES IN DATABASE</h3>

      <table id="table">
        <thead>
          <tr>
            <th>COMPANY/BRAND</th>
            <th>SHOE NAME</th>
            <th>IMAGE</th>
            <th>SIZE</th>
            <th>PRICE</th>
            <th>GENDER</th>
            <th>CONDITION</th>
            <th>STOCK</th>
            <th>ACTIONS</th>

          </tr>
        </thead>
        <tbody id="tablerow">
       
        </tbody>
      </table>
    </div>

    <div id="modaloverlay">
      <div id="modal">
        <button id="closemodalbtn">✕</button>
        <h4>DUPLICATE EXISTED</h4>
        <h6>THIS SHOE ALREADY EXISTED IN YOUR DATABASE</h6>
        <p id="brandmodal">BRAND:</p>
        <p id="shoemodal">SHOE:</p>
      </div>

    </div>

    <div id="emptyinputmodal">
    <p id="emptyinputmessage"></p>
    <button id="closeemptyinputmodal">OK</button>
</div>

<div id="loadingOverlay">
    <div id="loadingBox">
        <div id="loadingSpinner"></div>
        <p>Loading...</p>
    </div>
</div>





<div id="searchmodal">

    <div id="searchbox">

        <button id="closesearchmodal">✕</button>

        <h2>SEARCH BY BRAND</h2>

        <select id="searchbrandinput">
       <option value="NIKE">NIKE</option>
  <option value="ADIDAS">ADIDAS</option>
  <option value="PUMA">PUMA</option>
  <option value="REEBOK">REEBOK</option>
  <option value="NEW_BALANCE">NEW BALANCE</option>
  <option value="CONVERSE">CONVERSE</option>
  <option value="VANS">VANS</option>
  <option value="ASICS">ASICS</option>
  <option value="SKECHERS">SKECHERS</option>
  <option value="UNDER_ARMOUR">UNDER ARMOUR</option>
  <option value="JORDAN">JORDAN</option>
  <option value="TIMBERLAND">TIMBERLAND</option>
  <option value="FILA">FILA</option>
  <option value="BATA">BATA</option>
  <option value="CLARKS">CLARKS</option>
  <option value="OTHER">OTHER</option>
        </select>

        <button id="performsearchbtn">SEARCH</button>

    </div>

</div>
    <script src="interface.js"></script>
  </body>
</html>
